<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sprint-Planner · Prova de Testes — TP2 DCC603 UFMG</title>
<meta name="description" content="Relatório de resultados de testes automatizados do projeto Sprint-Planner (TP2, Engenharia de Software, DCC603, UFMG)." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600;9..144,900&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ============================================================
   SPRINT-PLANNER · PROVA DE TESTES
   Direção: "Prova de impressão de relatório técnico de auditoria"
   Grade Swiss · tinta sobre papel creme · crop marks · numerais editoriais
   ============================================================ */

/* ---------- TOKENS DE COR ---------- */
:root{
  --paper:        #F4F1EA;
  --paper-panel:  #EDE8DD;
  --paper-sunk:   #E7E1D3;
  --ink:          #16130E;
  --ink-soft:     #5C564B;
  --rule:         rgba(22,19,8,0.12);
  --rule-strong:  rgba(22,19,8,0.28);
  --accent:       #E4572E; /* vermelho-queimado: SÓ negativo/exceção (falha, abaixo da meta) */
  --accent-ink:   #B23A18; /* variante de TEXTO em vermelho (passa AA p/ texto pequeno) */
  --good:         #2F6B5E; /* verde-petróleo dessaturado: estado positivo (meta atingida) — frio, coeso com o creme */
  --good-ink:     #285C51; /* variante de TEXTO p/ o positivo (contraste reforçado) */
  --warn-bg:      #16130E;
  --warn-fg:      #F4F1EA;
  --focus:        #16130E;

  --font-display: 'Fraunces','Georgia',serif;
  --font-body:    'Newsreader','Georgia',serif;
  --font-mono:    'IBM Plex Mono',ui-monospace,'Menlo',monospace;

  --maxw: 1280px;
  --gap: clamp(12px,1.5vw,24px);
  --pad: clamp(20px,4vw,72px);
}

/* ---------- RESET ---------- */
*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:clamp(15px,1.05vw,17px);
  line-height:1.55;
  font-feature-settings:"liga" 1;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{ max-width:100%; display:block; }
button{ font:inherit; color:inherit; cursor:pointer; }
a{ color:var(--ink); text-underline-offset:.18em; }

/* tabular numerals helper */
.tnum{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }

/* texto exclusivo de leitor de tela (alternativa textual de glifos) */
.sr{
  position:absolute;
  width:1px; height:1px;
  padding:0; margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  clip-path:inset(50%);
  white-space:nowrap;
  border:0;
}

/* ---------- ATMOSFERA: 3 camadas ---------- */
/* 1. Grão de papel */
body::before{
  content:"";
  position:fixed; inset:0;
  z-index:0;
  pointer-events:none;
  opacity:.045;
  mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}
/* 2. Grade de baseline (papel pautado técnico) — sutil, sugere pauta sem virar listras */
body::after{
  content:"";
  position:fixed; inset:0;
  z-index:0;
  pointer-events:none;
  opacity:.09;
  background-image:repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px);
}

/* ---------- CONTAINER / GRADE SWISS ---------- */
.sheet{
  position:relative;
  z-index:1;
  max-width:var(--maxw);
  margin-inline:auto;
  padding:var(--pad);
}
/* guias verticais de coluna (assumidamente Swiss) */
.sheet::before{
  content:"";
  position:absolute;
  top:var(--pad); bottom:var(--pad);
  left:var(--pad); right:var(--pad);
  z-index:-1;
  pointer-events:none;
  opacity:.06;
  background-image:repeating-linear-gradient(
    to right,
    var(--ink) 0 1px,
    transparent 1px calc((100% - 11px)/12)
  );
}

/* crop marks nos 4 cantos do .sheet */
.cropmark{
  position:absolute;
  width:18px; height:18px;
  z-index:2;
  pointer-events:none;
}
.cropmark::before,.cropmark::after{
  content:"";
  position:absolute;
  background:var(--ink-soft);
}
.cropmark::before{ width:18px; height:1px; top:0; left:0; }
.cropmark::after{ width:1px; height:18px; top:0; left:0; }
.cropmark.tl{ top:6px; left:6px; }
.cropmark.tr{ top:6px; right:6px; }
.cropmark.tr::before{ left:auto; right:0; }
.cropmark.tr::after{ left:auto; right:0; }
.cropmark.bl{ bottom:6px; left:6px; }
.cropmark.bl::before{ top:auto; bottom:0; }
.cropmark.bl::after{ top:auto; bottom:0; }
.cropmark.br{ bottom:6px; right:6px; }
.cropmark.br::before{ top:auto; bottom:0; left:auto; right:0; }
.cropmark.br::after{ top:auto; bottom:0; left:auto; right:0; }
/* animação de desenho */
.cropmark{ opacity:0; }
.loaded .cropmark{ animation:cropIn .4s ease forwards; }
@keyframes cropIn{ to{ opacity:1; } }

/* vinheta sutil pro projetor + pisos tipográficos maiores p/ leitura à distância */
@media (min-width:1600px){
  :root{ --maxw:1440px; }
  .sheet{ box-shadow:inset 0 0 200px 40px rgba(22,19,8,0.05); }
  body{ font-size:19px; }
  .label,.colophon dt,.colophon dd,.sublevel .sl-name,
  .e2e-card .e2e-no,.figframe figcaption,.colofim{ font-size:.84rem; }
  table.cov-table{ font-size:.92rem; }
}
/* modo apresentação (?present=1): escala global p/ projetar do fundo da sala */
body.present{ font-size:21px; }
body.present .label,body.present .colophon dt,body.present .colophon dd,
body.present .sublevel .sl-name{ font-size:.9rem; }

/* ---------- TIPOGRAFIA UTIL ---------- */
.mono{ font-family:var(--font-mono); }
.label{
  font-family:var(--font-mono);
  font-weight:500;
  text-transform:uppercase;
  letter-spacing:.08em;
  font-size:.72rem;
  color:var(--ink-soft);
}
.tbd{
  font-family:var(--font-body);
  font-style:italic;
  color:var(--ink-soft);
}
.tbd::before{ content:"⟢ "; opacity:.5; }

/* ---------- TARJA PRÉVIA (sticky) ---------- */
.preview-bar{
  position:sticky; top:0;
  z-index:50;
  background:var(--warn-bg);
  color:var(--warn-fg);
  padding:10px clamp(16px,3vw,40px);
  font-family:var(--font-mono);
  font-weight:500;
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:clamp(.6rem,1vw,.78rem);
  text-align:center;
  position:sticky;
  overflow:hidden;
}
.preview-bar::before{
  content:"";
  position:absolute; inset:0;
  z-index:0;
  pointer-events:none;
  background-image:repeating-linear-gradient(135deg,
    rgba(228,87,46,.18) 0 10px,
    transparent 10px 28px);
  background-size:200% 100%;
  animation:hazardSlide 20s linear infinite;
}
@keyframes hazardSlide{ to{ background-position:200% 0; } }
.preview-bar span{ position:relative; z-index:1; }

/* ---------- HEADER / COLOFÃO ---------- */
.masthead{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:var(--gap);
  align-items:start;
  padding-top:clamp(28px,5vw,64px);
  position:relative;
}
.masthead .title-block{ grid-column:1 / 8; }
.masthead h1{
  font-family:var(--font-display);
  font-weight:300;
  font-size:clamp(40px,7vw,88px);
  line-height:.96;
  letter-spacing:-.01em;
  margin:0;
  font-variation-settings:"opsz" 144;
}
.masthead .subtitle{
  margin:.6em 0 0;
  font-family:var(--font-body);
  font-size:clamp(1rem,1.6vw,1.3rem);
  color:var(--ink-soft);
  max-width:40ch;
}
.colophon{ grid-column:8 / 13; align-self:start; }
.colophon dl{
  margin:0;
  display:grid;
  grid-template-columns:auto 1fr;
  gap:0;
  border-top:1px solid var(--rule-strong);
}
.colophon dt,.colophon dd{
  font-family:var(--font-mono);
  font-size:.74rem;
  padding:7px 0;
  border-bottom:1px solid var(--rule);
  margin:0;
}
.colophon dt{
  text-transform:uppercase;
  letter-spacing:.07em;
  color:var(--ink-soft);
  padding-right:14px;
}
.colophon dd{ text-align:right; }

/* CARIMBO de veracidade */
.stamp{
  position:absolute;
  top:8px; right:0;
  z-index:5;
  font-family:var(--font-mono);
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.1em;
  font-size:.66rem;
  line-height:1.35;
  text-align:center;
  padding:10px 14px;
  max-width:200px;
  mix-blend-mode:multiply;
}
.stamp.sample{
  color:var(--accent-ink); /* texto pequeno do carimbo passa AA; a borda continua --accent (gráfico) */
  border:2px double var(--accent);
  transform:rotate(-4deg);
}
.stamp.sample::after{
  content:"";
  position:absolute; inset:0;
  pointer-events:none;
  opacity:.25;
  mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'><filter id='s'><feTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23s)'/></svg>");
}
.stamp.measured{
  color:var(--ink);
  border:2px solid var(--ink);
  transform:rotate(-1deg);
}
.loaded .stamp{ animation:stampPulse .5s ease .4s both; }
@keyframes stampPulse{
  0%{ transform:rotate(-4deg) scale(1.18); opacity:0; }
  60%{ opacity:1; }
  100%{ }
}
.stamp.measured.loaded, .loaded .stamp.measured{ animation:stampPulseM .5s ease .4s both; }
@keyframes stampPulseM{
  0%{ transform:rotate(-1deg) scale(1.12); opacity:0; }
  100%{ transform:rotate(-1deg) scale(1); opacity:1; }
}

/* linha de veredito */
.verdict{
  grid-column:1 / 13;
  margin-top:clamp(20px,3vw,36px);
  padding-top:14px;
  border-top:1px solid var(--rule);
  font-family:var(--font-mono);
  font-size:clamp(.72rem,1.1vw,.9rem);
  letter-spacing:.04em;
  display:flex;
  flex-wrap:wrap;
  gap:clamp(14px,3vw,42px);
}
.verdict .vitem{ white-space:nowrap; display:inline-flex; align-items:baseline; gap:.5em; }
.verdict .vk{ color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em; }
/* veredito coerente com o sistema de glifos: glifo do sistema + palavra (nunca só cor, nunca ✓/✕ genéricos) */
.verdict .vmark{
  font-family:var(--font-mono); font-weight:600;
  text-transform:uppercase; letter-spacing:.06em;
  display:inline-flex; align-items:baseline; gap:.35em;
}
.verdict .vmark .vg{ font-family:var(--font-mono); }
.verdict .ok{ color:var(--good-ink); }
.verdict .ok .vg{ color:var(--good); }
.verdict .bad{ color:var(--accent-ink); }
.verdict .bad .vg{ color:var(--accent); }

/* ---------- SEÇÕES ---------- */
.section{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:var(--gap);
  margin-top:clamp(48px,7vw,96px);
  padding-top:clamp(18px,2vw,28px);
  border-top:1px solid var(--rule-strong);
}
.section > .idx{
  grid-column:1 / 2;
  font-family:var(--font-mono);
  font-weight:600;
  font-size:clamp(20px,2.4vw,34px);
  color:var(--ink-soft);
  line-height:1;
  letter-spacing:-.02em;
}
.section > .body{ grid-column:2 / 13; }
.section .sec-label{ display:block; margin-bottom:.5em; }
.section h2{
  font-family:var(--font-display);
  font-weight:300;
  font-size:clamp(26px,4vw,52px);
  line-height:1;
  letter-spacing:-.01em;
  margin:0 0 .7em;
  font-variation-settings:"opsz" 100;
}

/* reveal escalonado — dispara quando o elemento ENTRA na viewport (classe .in
   adicionada pelo IntersectionObserver), com stagger relativo aos irmãos visíveis. */
.reveal{ opacity:0; }
.reveal.in{
  animation:revealUp .6s cubic-bezier(.2,.8,.2,1) both;
  animation-delay:var(--d,0ms);
}
@keyframes revealUp{
  from{ opacity:0; clip-path:inset(100% 0 0 0); transform:translateY(8px); }
  to{ opacity:1; clip-path:inset(0 0 0 0); transform:none; }
}

/* ---------- 01 COBERTURA ---------- */
.cov-hero{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:var(--gap);
  align-items:end;
}
.cov-numeral{
  grid-column:1 / 8;
  display:flex;
  align-items:flex-end;
  gap:.12em;
  line-height:.8;
}
.cov-numeral .big{
  font-family:var(--font-display);
  font-weight:900;
  font-variation-settings:"opsz" 144;
  font-size:clamp(64px,14vw,180px);
  letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
}
.cov-numeral .pct{
  font-family:var(--font-mono);
  font-weight:500;
  font-size:clamp(20px,3vw,42px);
  color:var(--ink-soft);
  padding-bottom:.4em;
}
.cov-numeral.over .big{ color:var(--good); }   /* meta atingida = positivo frio, NUNCA o vermelho de erro */
.cov-numeral.under .big{ color:var(--accent); } /* abaixo da meta = exceção em vermelho */
.cov-caption{ grid-column:1 / 8; margin-top:.4em; }
.cov-caption .cov-state{ font-weight:600; }
.cov-caption.over .cov-state{ color:var(--good-ink); }
.cov-caption.under .cov-state{ color:var(--accent-ink); }

/* gauge linear com cota de threshold */
.gauge{
  grid-column:1 / 8;
  margin-top:18px;
  position:relative;
  height:34px;
}
.gauge .track{
  position:absolute; left:0; right:0; top:16px;
  height:1px; background:var(--rule-strong);
}
.gauge .fill{
  position:absolute; left:0; top:14px;
  height:5px; background:var(--ink);
  transform-origin:left center;
  transform:scaleX(0);
}
.loaded .gauge .fill{ animation:growX .9s cubic-bezier(.2,.8,.2,1) .3s forwards; }
@keyframes growX{ to{ transform:scaleX(var(--v,1)); } }
.gauge .valtick{
  position:absolute; top:6px;
  width:2px; height:22px; background:var(--ink);
  transform:translateX(-50%);
}
.gauge .threshtick{
  position:absolute; top:2px;
  width:0; height:30px;
  border-left:2px dashed var(--rule-strong); /* cota de referência neutra, não a tinta de erro */
  transform:translateX(-50%);
}
.gauge .threshlabel{
  position:absolute; top:-14px;
  left:clamp(2.5rem, var(--tx,50%), calc(100% - 2.5rem)); /* nunca vaza fora do trilho */
  transform:translateX(-50%);
  font-family:var(--font-mono);
  font-size:.62rem;
  color:var(--ink-soft); /* referência neutra */
  text-transform:uppercase;
  letter-spacing:.06em;
  white-space:nowrap;
}
/* o pulse ao cruzar a meta vira POSITIVO (verde-petróleo), não alarme vermelho */
.gauge .threshtick.pulse{ animation:tickPulse .5s ease 1.0s 1; }
@keyframes tickPulse{ 50%{ box-shadow:0 0 0 3px rgba(47,107,94,.45); } }

/* subníveis */
.sublevels{
  grid-column:8 / 13;
  align-self:end;
}
@media (max-width:991px){
  .cov-numeral,.cov-caption,.gauge,.sublevels{ grid-column:1 / 13; }
  .sublevels{ margin-top:28px; }
}
.sublevel{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid var(--rule);
}
.sublevel .sl-name{
  font-family:var(--font-mono);
  text-transform:uppercase;
  letter-spacing:.06em;
  font-size:.72rem;
  color:var(--ink-soft);
}
.sublevel .sl-val{
  font-family:var(--font-mono);
  font-weight:500;
  font-size:.95rem;
  font-variant-numeric:tabular-nums;
}
.sublevel .sl-bar{
  grid-column:1 / 3;
  position:relative;
  height:6px;
  background:var(--paper-sunk);
  margin-top:2px;
}
.sublevel .sl-bar .b{
  position:absolute; left:0; top:0; bottom:0;
  background:var(--ink);
  transform-origin:left;
  transform:scaleX(0);
}
.loaded .sublevel .sl-bar .b{ animation:growX .8s cubic-bezier(.2,.8,.2,1) .45s forwards; }
.sublevel .sl-bar .t80{
  position:absolute; top:-3px; bottom:-3px;
  left:80%;
  border-left:1.5px dashed var(--accent);
}
.sublevel.below .sl-val{ color:var(--accent-ink); }
.sublevel.below .sl-name::after{ content:" ▸ abaixo da meta"; color:var(--accent-ink); font-size:.9em; letter-spacing:.04em; }

/* tabela coverageByFile */
.cov-table-wrap{
  grid-column:1 / 13; margin-top:clamp(28px,4vw,52px); overflow-x:auto;
  position:relative;
  /* dica visual de scroll lateral: fade nas bordas quando há overflow */
  background:
    linear-gradient(to right, var(--paper) 30%, rgba(244,241,234,0)) left center / 28px 100% no-repeat,
    linear-gradient(to left, var(--paper) 30%, rgba(244,241,234,0)) right center / 28px 100% no-repeat,
    radial-gradient(farthest-side at 0 50%, rgba(22,19,8,.10), rgba(22,19,8,0)) left center / 12px 100% no-repeat,
    radial-gradient(farthest-side at 100% 50%, rgba(22,19,8,.10), rgba(22,19,8,0)) right center / 12px 100% no-repeat;
  background-attachment:local, local, scroll, scroll;
}
table.cov-table{
  width:100%;
  border-collapse:collapse;
  font-family:var(--font-mono);
  font-size:.82rem;
  min-width:680px;
}
table.cov-table thead th{
  position:sticky; top:0;
  background:var(--paper);
  text-align:right;
  text-transform:uppercase;
  letter-spacing:.06em;
  font-size:.66rem;
  color:var(--ink-soft);
  font-weight:500;
  padding:0;
  border-bottom:1px solid var(--rule-strong);
}
table.cov-table thead th button{
  background:none; border:0; padding:12px 8px;
  width:100%; height:100%; min-height:44px; text-align:right;
  font:inherit; text-transform:uppercase; letter-spacing:.06em;
  color:var(--ink-soft);
  display:flex; justify-content:flex-end; align-items:center; gap:5px;
}
table.cov-table thead th:first-child button{ justify-content:flex-start; text-align:left; }
table.cov-table thead th[aria-sort="ascending"] button::after{ content:"▲"; font-size:.6em; color:var(--ink); }
table.cov-table thead th[aria-sort="descending"] button::after{ content:"▼"; font-size:.6em; color:var(--ink); }
table.cov-table tbody td{
  padding:9px 8px;
  text-align:right;
  border-bottom:1px solid var(--rule);
  font-variant-numeric:tabular-nums;
  position:relative;
}
table.cov-table tbody td.file{ text-align:left; color:var(--ink); }
table.cov-table tbody tr:nth-child(even){ background:var(--paper-sunk); }
table.cov-table td .cell-bar{
  position:absolute; left:8px; right:8px; bottom:3px;
  height:3px; background:var(--rule);
}
table.cov-table td .cell-bar .b{
  position:absolute; left:0; top:0; bottom:0; background:var(--ink); opacity:.5;
}
table.cov-table td.lo{ color:var(--accent-ink); font-weight:600; }
table.cov-table td.lo .file-flag{ color:var(--accent-ink); }
.cov-table tbody td.file .flag{
  display:inline-block; width:1em; color:var(--accent-ink); font-weight:700;
}

/* ---------- 02 UNIDADE ---------- */
.scoreline{
  display:flex; align-items:baseline; flex-wrap:wrap; gap:.5em 1.2em;
  margin-bottom:1.4em;
}
.scoreline .score{
  font-family:var(--font-display);
  font-weight:900;
  font-variation-settings:"opsz" 144;
  font-size:clamp(40px,8vw,96px);
  line-height:.85;
  letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
}
.scoreline .score .sep{ color:var(--ink-soft); font-weight:300; }
.scoreline .score-word{
  font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.12em;
  font-size:clamp(.8rem,1.5vw,1.1rem); color:var(--ink-soft);
}
.scoreline .fails{ color:var(--accent-ink); font-weight:600; }
.scoreline .skips{ color:var(--ink-soft); }
.scoreline .dur{ font-family:var(--font-mono); color:var(--ink-soft); font-size:.95rem; }

.suite{ margin-bottom:clamp(20px,3vw,34px); }
.suite > .suite-head{
  display:flex; justify-content:space-between; align-items:baseline; gap:1em;
  padding-bottom:8px; border-bottom:1px solid var(--rule-strong);
  flex-wrap:wrap;
}
.suite > .suite-head .sname{ font-family:var(--font-display); font-weight:600; font-size:1.05rem; }
.suite > .suite-head .sfile{ font-family:var(--font-mono); font-size:.72rem; color:var(--ink-soft); }

/* --- dono da fatia: quem APRESENTA cada suíte/E2E (divisão do grupo, TP2) --- */
.owner-badge{
  display:inline-block; font-family:var(--font-mono); font-size:.62rem;
  text-transform:uppercase; letter-spacing:.06em; line-height:1.45;
  padding:.12em .55em; border:1px solid var(--rule-strong); border-left-width:3px;
  border-radius:2px; color:var(--ink-soft); background:rgba(22,19,8,0.03);
  white-space:nowrap; vertical-align:middle;
}
.suite > .suite-head .owner-badge{ margin-right:auto; }
.own-banco{ border-left-color:#1d4ed8; }   /* azul — Banco (Rafael) */
.own-api{ border-left-color:#B23A18; }      /* vermelho-tinta — API */
.own-unidade{ border-left-color:#2F6B5E; }  /* verde-petróleo — Unidade */
.own-front{ border-left-color:#6d28d9; }    /* roxo — Front-end */
.owner-line{ display:flex; gap:.45em; flex-wrap:wrap; margin:.15em 0 .55em; }

.test-row{ border-bottom:1px solid var(--rule); }
.test-row.pinned{ border-left:3px solid var(--accent); padding-left:10px; margin-left:-13px; }
.test-row > details{ }
.test-row summary{
  list-style:none;
  display:grid;
  grid-template-columns:1.6em 1fr auto auto;
  align-items:center;
  gap:10px;
  padding:11px 4px;
  min-height:44px;
}
/* rótulo textual de status visível ao lado do glifo (não depende só de cor — 1.4.1) */
.test-row .st-word{
  font-family:var(--font-mono); font-size:.6rem; text-transform:uppercase;
  letter-spacing:.1em; color:var(--ink-soft);
}
.test-row .st-passed .st-word{ color:var(--good-ink); }
.test-row .st-failed .st-word{ color:var(--accent-ink); font-weight:600; }
.test-row .st-skipped .st-word{ color:var(--ink-soft); }
.test-row summary::-webkit-details-marker{ display:none; }
.test-row summary:hover{ background:var(--paper-panel); }
.test-row summary .g{
  font-family:var(--font-mono); font-weight:600; text-align:center;
  transition:transform .18s ease;
}
.test-row summary:hover .g{ transform:translateX(2px); }
.test-row .st-passed .g{ color:var(--good); }
.test-row .st-failed .g{ color:var(--accent-ink); }
.test-row .st-skipped .g{ color:var(--ink-soft); }
.test-row .tname{ font-family:var(--font-body); }
.test-row .st-failed .tname{ color:var(--accent-ink); font-weight:500; }
.test-row .tdur{ font-family:var(--font-mono); font-size:.78rem; color:var(--ink-soft); }
.test-row .pill{
  font-family:var(--font-mono); font-size:.58rem; text-transform:uppercase;
  letter-spacing:.1em; color:var(--accent-ink); border:1px solid var(--accent-ink);
  padding:1px 5px; margin-left:8px;
}
.test-detail{ padding:6px 4px 18px 2.6em; }
.revisor-note{
  font-family:var(--font-body);
  border-left:2px solid var(--rule-strong);
  padding:2px 0 2px 16px;
  margin:0 0 14px;
  color:var(--ink);
  max-width:62ch;
}
.revisor-note .rn-label{
  display:block;
  font-family:var(--font-mono); font-size:.6rem; text-transform:uppercase;
  letter-spacing:.1em; color:var(--ink-soft); margin-bottom:4px;
}
/* "O que testa" + "Resultado esperado" — claim de apresentação, em destaque antes do código */
.test-claims{
  margin:0 0 16px;
  border-left:2px solid var(--ink);
  background:var(--paper-panel);
  padding:12px 16px;
  display:grid;
  gap:10px;
  max-width:64ch;
}
.test-claims .claim{ display:grid; gap:3px; margin:0; }
.test-claims .claim-label{
  font-family:var(--font-mono); font-weight:500; font-size:.62rem;
  text-transform:uppercase; letter-spacing:.12em; color:var(--ink-soft);
}
.test-claims .claim-text{
  margin:0;
  font-family:var(--font-body); font-size:.98rem; line-height:1.5; color:var(--ink);
}
.codeblock{
  background:var(--paper-sunk);
  border:1px solid var(--rule);
  font-family:var(--font-mono);
  font-size:.76rem;
  line-height:1.5;
  overflow-x:auto;
  counter-reset:ln;
}
.codeblock .cl{
  display:grid; grid-template-columns:2.6em 1fr;
}
.codeblock .cl::before{
  counter-increment:ln; content:counter(ln);
  color:var(--ink-soft); opacity:.6; text-align:right; padding-right:12px;
  border-right:1px solid var(--rule); user-select:none;
}
.codeblock .cl code{ padding-left:12px; white-space:pre; }

/* ---------- 03 E2E ---------- */
.e2e-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:var(--gap);
}
@media (max-width:991px){ .e2e-grid{ grid-template-columns:1fr; } }
.e2e-card{
  border:1px solid var(--rule-strong);
  background:var(--paper-panel);
  padding:clamp(16px,2vw,26px);
  position:relative;
}
.e2e-card .e2e-no{
  font-family:var(--font-mono); font-size:.66rem; letter-spacing:.1em;
  color:var(--ink-soft); text-transform:uppercase;
}
.e2e-card h3{
  font-family:var(--font-display); font-weight:600;
  font-size:clamp(1.1rem,2vw,1.5rem); line-height:1.05;
  margin:.3em 0 .7em; display:flex; align-items:flex-start; gap:.4em;
}
.e2e-card h3 .g{ font-family:var(--font-mono); }
.e2e-card.st-passed h3 .g{ color:var(--good); }
.e2e-card.st-failed h3 .g{ color:var(--accent-ink); }
/* rótulo de status do E2E coerente com o tom semântico */
.e2e-card.st-passed .e2e-meta .label{ color:var(--good-ink); }
.e2e-card.st-failed .e2e-meta .label{ color:var(--accent-ink); font-weight:600; }
.e2e-steps{ list-style:none; margin:0 0 14px; padding:0; position:relative; }
.e2e-steps li{
  position:relative; padding:6px 0 6px 26px;
  font-family:var(--font-body); font-size:.92rem;
}
.e2e-steps li::before{
  content:counter(step);
  counter-increment:step;
  position:absolute; left:0; top:6px;
  font-family:var(--font-mono); font-size:.7rem; font-weight:600;
  width:16px; height:16px; line-height:16px; text-align:center;
  border:1px solid var(--rule-strong); border-radius:50%;
}
.e2e-steps{ counter-reset:step; }
.e2e-steps li::after{
  content:""; position:absolute; left:8px; top:22px; bottom:-6px;
  border-left:1px solid var(--rule);
}
.e2e-steps li:last-child::after{ display:none; }
.e2e-meta{ display:flex; justify-content:space-between; align-items:center; gap:1em; margin-bottom:12px; }
.e2e-meta .dur{ font-family:var(--font-mono); font-size:.78rem; color:var(--ink-soft); }
/* selo de status do E2E: glifo + palavra + N/N; verde quando passou */
.e2e-seal{
  font-family:var(--font-mono); font-weight:600; font-size:.66rem;
  text-transform:uppercase; letter-spacing:.08em;
  display:inline-flex; align-items:center; gap:.4em;
  padding:4px 9px; border:1px solid currentColor; border-radius:2px;
}
.e2e-seal .g{ font-family:var(--font-mono); }
.e2e-seal.seal-passed{ color:var(--good-ink); background:rgba(47,107,94,.08); }
.e2e-seal.seal-failed{ color:var(--accent-ink); background:rgba(228,87,46,.08); }
.e2e-seal.seal-skipped{ color:var(--ink-soft); }
/* moldura do vídeo embutido */
.figframe.e2e-video{ padding:6px; }
.figframe.e2e-video video{ outline:none; }

.figframe{
  border:1px solid var(--rule-strong);
  padding:6px; margin-bottom:12px; position:relative;
  background:var(--paper);
}
.figframe img{ width:100%; }
.figframe figcaption{
  font-family:var(--font-mono); font-size:.62rem; text-transform:uppercase;
  letter-spacing:.08em; color:var(--ink-soft); margin-top:6px;
}
.fig-missing{
  font-family:var(--font-mono); font-size:.74rem; color:var(--ink-soft);
  text-align:center; padding:28px 10px;
  background-image:repeating-linear-gradient(45deg,
    var(--rule) 0 1px, transparent 1px 9px);
  border:1px dashed var(--rule-strong);
  margin-bottom:12px;
}
.e2e-actions{ display:flex; gap:10px; flex-wrap:wrap; }
.btn{
  font-family:var(--font-mono); font-size:.7rem; text-transform:uppercase;
  letter-spacing:.08em; background:none; border:1px solid var(--ink);
  padding:11px 14px; min-height:44px; display:inline-flex; align-items:center;
}
.btn:hover{ background:var(--ink); color:var(--paper); }
.btn[disabled]{ border-color:var(--rule-strong); color:var(--ink-soft); cursor:not-allowed; }
.btn[disabled]:hover{ background:none; color:var(--ink-soft); }

/* ---------- 04 PIRÂMIDE ---------- */
.pyramid{ display:flex; flex-direction:column; gap:8px; max-width:760px; list-style:none; margin:0; padding:0; }
.pyr-row{
  display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:14px;
}
.pyr-row .pr-label{
  font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.08em;
  font-size:.72rem; color:var(--ink-soft); width:9em; text-align:right;
}
.pyr-row .pr-bar{
  height:clamp(34px,5vw,52px); background:var(--ink);
  transform-origin:left; transform:scaleX(0);
  border-right:1px solid var(--paper);
}
/* barras da pirâmide crescem ao ENTRAR na viewport (não off-screen no load) */
.pyramid.bars-in .pr-bar{ animation:growX .85s cubic-bezier(.2,.8,.2,1) var(--pd,0ms) forwards; }
.pyr-row .pr-count{ font-family:var(--font-mono); font-weight:600; font-variant-numeric:tabular-nums; }
.pyr-caption{ font-family:var(--font-body); font-style:italic; color:var(--ink-soft); margin-top:16px; max-width:56ch; }

/* ---------- 05 IA ---------- */
.ai-grid{ display:grid; grid-template-columns:1.4fr 1fr; gap:clamp(24px,4vw,56px); }
@media (max-width:767px){ .ai-grid{ grid-template-columns:1fr; } }
.ai-summary{ font-family:var(--font-body); font-size:clamp(1rem,1.4vw,1.18rem); line-height:1.6; }
.ai-summary::first-letter{
  font-family:var(--font-display); font-weight:900;
  font-variation-settings:"opsz" 144;
  color:var(--accent);
  float:left; font-size:3.4em; line-height:.72; padding:.05em .08em 0 0;
}
.ai-seal{
  font-family:var(--font-mono); font-size:.62rem; text-transform:uppercase;
  letter-spacing:.16em; color:var(--ink-soft); border:1px solid var(--rule-strong);
  display:inline-block; padding:3px 9px; margin-top:18px;
}
.ai-lists h4{
  font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.08em;
  font-size:.72rem; color:var(--ink-soft); margin:0 0 .6em; padding-bottom:6px;
  border-bottom:1px solid var(--rule-strong);
}
.ai-lists ul{ list-style:none; margin:0 0 22px; padding:0; }
.ai-lists li{ font-family:var(--font-body); padding:7px 0 7px 22px; position:relative; border-bottom:1px solid var(--rule); }
.ai-lists .pros li::before{ content:"─"; position:absolute; left:0; color:var(--ink); font-family:var(--font-mono); }
/* bullet de limitação: glifo DISTINTO do "falhou" (●) para não colidir o significado; vermelho-texto (AA) */
.ai-lists .cons li{ padding-left:26px; }
.ai-lists .cons li::before{ content:"▸"; position:absolute; left:0; color:var(--accent-ink); font-family:var(--font-mono); font-weight:700; }

/* ---------- 06 EQUIPE ---------- */
.team{ display:grid; grid-template-columns:repeat(2,1fr); gap:0; }
@media (max-width:767px){ .team{ grid-template-columns:1fr; } }
.member{
  display:grid; grid-template-columns:auto 1fr; gap:18px; align-items:start;
  padding:clamp(16px,2.4vw,28px) 0; border-bottom:1px solid var(--rule);
}
.member:nth-child(odd){ padding-right:clamp(16px,3vw,40px); border-right:1px solid var(--rule); }
.member:nth-child(even){ padding-left:clamp(16px,3vw,40px); }
@media (max-width:767px){
  .member:nth-child(odd){ border-right:0; padding-right:0; }
  .member:nth-child(even){ padding-left:0; }
}
.member .inits{
  font-family:var(--font-display); font-weight:900;
  font-variation-settings:"opsz" 144;
  font-size:clamp(28px,4vw,44px); line-height:.9;
  background:var(--paper-panel); color:var(--ink);
  width:1.7em; height:1.7em; display:flex; align-items:center; justify-content:center;
  font-variant-numeric:tabular-nums;
}
.member .m-name{ font-family:var(--font-display); font-weight:600; font-size:clamp(1.05rem,1.8vw,1.3rem); margin:0; }
.member .m-role{ font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.08em; font-size:.7rem; color:var(--ink-soft); margin:.4em 0; }
.member .m-contrib{ font-family:var(--font-body); font-size:.92rem; margin:.3em 0 0; }
.member .m-commits{ font-family:var(--font-mono); font-size:.72rem; color:var(--ink-soft); margin-top:.5em; }
/* faixa honesta quando papéis/contribuições ainda não foram definidos */
.team-pending{
  grid-column:1 / -1;
  font-family:var(--font-body); font-style:italic; color:var(--ink-soft);
  border-left:2px dashed var(--rule-strong);
  padding:10px 0 12px 16px; margin:0 0 8px;
  max-width:64ch;
}
.team-pending .tp-label{
  display:block; font-style:normal;
  font-family:var(--font-mono); font-size:.6rem; text-transform:uppercase;
  letter-spacing:.1em; color:var(--ink-soft); margin-bottom:5px;
}
/* placeholder de campo-a-preencher: comunica "pendente" como intenção de design */
.field-pending{
  font-family:var(--font-mono); font-size:.74rem; color:var(--ink-soft);
  border-bottom:1px dashed var(--rule-strong); padding-bottom:1px;
}
/* iniciais menores quando não há conteúdo ao lado (evita peso vazio) */
.member.is-pending .inits{ font-size:clamp(22px,3vw,32px); opacity:.85; }

/* ---------- FOOTER ---------- */
.colofim{
  margin-top:clamp(56px,8vw,110px);
  padding-top:18px;
  border-top:1px solid var(--rule-strong);
  position:relative;
  font-family:var(--font-mono); font-size:.72rem; color:var(--ink-soft);
  display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;
  letter-spacing:.04em;
}
.colofim .fstate.sample{ color:var(--accent-ink); font-weight:600; }
.colofim .fstate.measured{ color:var(--ink); font-weight:600; }

/* ---------- DIALOG (vídeo) ---------- */
dialog{
  border:1px solid var(--ink); background:var(--paper); color:var(--ink);
  padding:0; max-width:min(900px,92vw); width:100%;
}
dialog::backdrop{ background:rgba(22,19,8,.6); }
dialog .dlg-head{
  display:flex; justify-content:space-between; align-items:center;
  padding:12px 16px; border-bottom:1px solid var(--rule);
  font-family:var(--font-mono); font-size:.78rem; text-transform:uppercase; letter-spacing:.08em;
}
dialog video{ width:100%; display:block; }
dialog .dlg-close{ background:none; border:1px solid var(--ink); padding:11px 14px; min-height:44px; font-family:var(--font-mono); font-size:.7rem; display:inline-flex; align-items:center; }

/* ---------- FOCO ---------- */
:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
summary:focus-visible{ outline-offset:-2px; }

/* ---------- ERRO DE CARGA ---------- */
.loaderr{
  font-family:var(--font-mono); font-size:.85rem; color:var(--accent-ink);
  border:1px solid var(--accent); padding:14px; margin-top:24px;
}

/* ---------- PREFERS-REDUCED-MOTION ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-delay:0ms !important;
    transition-duration:.001ms !important;
    scroll-behavior:auto !important;
  }
  .reveal{ opacity:1 !important; clip-path:none !important; transform:none !important; }
  .gauge .fill{ transform:scaleX(var(--v,1)) !important; }
  .sublevel .sl-bar .b{ transform:scaleX(var(--sv,1)) !important; }
  .pyr-row .pr-bar{ transform:scaleX(var(--pv,1)) !important; }
  .cropmark{ opacity:1 !important; }
  .stamp{ opacity:1 !important; }
  .preview-bar::before{ animation:none !important; }
}

/* ---------- PREFERS-CONTRAST: MORE ---------- */
@media (prefers-contrast:more){
  :root{ --rule:rgba(22,19,8,0.28); --ink-soft:#3d382f; }
  body::before{ display:none; }     /* grão fora */
  body::after{ opacity:.04; }       /* pauta quase imperceptível p/ não competir com texto */
  .sheet::before{ display:none; }   /* guias de coluna fora */
}

/* ---------- FAIXA INTERMEDIÁRIA (iPad retrato, janelas não-maximizadas) ----------
   Entre 768 e 991px o masthead 12-col empilha: title-block em cima, colophon
   abaixo (largura cheia), e o carimbo sai do absoluto para não cobrir o colofão. */
@media (min-width:768px) and (max-width:991px){
  .masthead .title-block{ grid-column:1 / 13; }
  .colophon{ grid-column:1 / 13; margin-top:22px; }
  .stamp{
    position:static; transform:rotate(-1.5deg) !important; max-width:none;
    margin-top:16px; display:inline-block;
  }
  .stamp.sample{ transform:rotate(-1.5deg) !important; }
}

/* ---------- MOBILE: grade 12 -> 4 ---------- */
@media (max-width:767px){
  .masthead, .section{ grid-template-columns:repeat(4,1fr); }
  .masthead .title-block{ grid-column:1 / 5; }
  .colophon{ grid-column:1 / 5; margin-top:24px; }
  .verdict{ grid-column:1 / 5; }
  .section > .idx{ grid-column:1 / 5; margin-bottom:.2em; }
  .section > .body{ grid-column:1 / 5; }
  .cov-hero{ grid-template-columns:repeat(4,1fr); }
  .stamp{ position:static; transform:none !important; max-width:none; margin-top:18px; display:inline-block; }
  .stamp.sample{ transform:rotate(-2deg) !important; }
}
</style>
</head>

<script>
(function(){
  "use strict";

  /* ---- utilidades honestas ---- */
  var TBD = "a definir";
  function isTBD(v){ return v == null || v === TBD; }
  // Sentinela: jamais inventa. "a definir"/null => marca como TBD literal.
  function renderField(v){
    if (isTBD(v)) return '<span class="tbd">a definir</span>';
    return esc(v);
  }
  function esc(s){
    return String(s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function fmtPct(n){
    if (n == null || isNaN(n)) return "—";
    return (Math.round(n*10)/10).toFixed(1);
  }
  function fmtDur(ms){
    if (ms == null) return "—";
    if (ms < 1000) return ms + " ms";
    return (ms/1000).toFixed(1).replace(".",",") + " s";
  }
  function fmtDateTime(iso){
    if (!iso) return "—";
    try{
      var d = new Date(iso);
      if (isNaN(d)) return esc(iso);
      var pad = function(x){ return String(x).padStart(2,"0"); };
      return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes());
    }catch(e){ return esc(iso); }
  }
  function initials(name){
    var parts = String(name).trim().split(/\s+/);
    var a = parts[0] ? parts[0][0] : "";
    var b = parts.length > 1 ? parts[parts.length-1][0] : "";
    return (a+b).toUpperCase();
  }
  var STATUS_GLYPH = { passed:"─", failed:"●", skipped:"┄" };
  var STATUS_WORD  = { passed:"passou", failed:"falhou", skipped:"pulado" };

  // prefers-reduced-motion: observado AO VIVO (não fica stale se o usuário mudar após o load)
  var motionMQ = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
  var prefersReduced = motionMQ ? motionMQ.matches : false;
  function reducedNow(){ return motionMQ ? motionMQ.matches : prefersReduced; }
  if (motionMQ){
    var onMQ = function(e){ prefersReduced = e.matches; };
    if (motionMQ.addEventListener) motionMQ.addEventListener("change", onMQ);
    else if (motionMQ.addListener) motionMQ.addListener(onMQ); // Safari antigo
  }

  /* ---- carga de dados: fetch -> fallback window.__DATA__ ---- */
  function load(){
    fetch("./data.json", { cache:"no-store" })
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(function(d){ boot(d, false); })
      .catch(function(err){
        if (window.__DATA__){ boot(window.__DATA__, true, err); }
        else { fatal(err); }
      });
  }
  function fatal(err){
    document.getElementById("app").innerHTML =
      '<div class="loaderr">Falha ao carregar dados e nenhum fallback embutido foi encontrado: '+esc(err && err.message)+'</div>';
  }

  function boot(data, usedFallback){
    try{
      // modo apresentação: ?present=1 aumenta a escala global p/ projetar do fundo da sala
      try{
        if (/[?&]present=1\b/.test(window.location.search)) document.body.classList.add("present");
      }catch(e){}
      render(data);
      mountPreview(data);
      // dispara o movimento de "cortina de impressão"
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){ document.body.classList.add("loaded"); });
      });
      if (usedFallback){ /* offline: dados vieram de window.__DATA__ */ }
      animateCountUp(data);
    }catch(e){
      fatal(e);
    }
  }

  /* ============================================================
     PREVIEW BAR (só se isSample)
     ============================================================ */
  function mountPreview(data){
    if (!(data.meta && data.meta.isSample === true)) return;
    // Conteúdo estático presente desde o load: NÃO é alerta dinâmico.
    // Usa landmark de região rotulada (sem aria-live, que atropelaria a leitura inicial).
    var bar = document.createElement("div");
    bar.className = "preview-bar";
    bar.setAttribute("role","region");
    bar.setAttribute("aria-label","Aviso de prévia: dados de exemplo, números não representam execução real");
    bar.innerHTML = '<span>Prévia — Dados de Exemplo · Números não representam execução real</span>';
    document.getElementById("preview-mount").appendChild(bar);
    // reflete o estado de prévia no título da página (perceptível a todos)
    try{ document.title = "PRÉVIA · " + document.title; }catch(e){}
  }

  /* ============================================================
     RENDER PRINCIPAL
     ============================================================ */
  function render(data){
    var m = data.meta || {};
    var s = data.summary || {};
    var cov = s.coverage || {};
    var unit = s.unit || {};
    var e2eSum = s.e2e || {};
    var threshold = (cov.threshold != null) ? cov.threshold : 80;

    var sample = m.isSample === true;

    // veredito derivado
    var vCov = (cov.lines != null) ? (cov.lines >= threshold) : true;
    var vUnit = (unit.failed != null) ? (unit.failed === 0) : true;
    var vE2E = (e2eSum.total != null) ? (e2eSum.passed >= e2eSum.total) : true;
    var vAI  = !!(data.ai && data.ai.summary);

    var html = "";
    var d = 0; // delay de stagger
    function nextDelay(){ d += 90; return d; }

    /* ---------- HEADER / MASTHEAD ---------- */
    html += '<header class="masthead">';
    html +=   '<div class="title-block reveal" style="--d:'+nextDelay()+'ms">';
    html +=     '<h1>'+esc(m.project||"—")+'</h1>';
    html +=     '<p class="subtitle">Prova de resultados de testes automatizados — cobertura, unidade/integração e ponta a ponta.</p>';
    html +=   '</div>';

    // carimbo
    if (sample){
      html += '<div class="stamp sample" aria-label="Selo de veracidade: prévia, dados de exemplo, não aferido">Prévia · Dados de Exemplo · Não Aferido</div>';
    } else {
      html += '<div class="stamp measured" aria-label="Selo de veracidade: aferido a partir de artefatos reais">Aferido · Artefatos Reais · '+fmtDateTime(m.generatedAt)+'</div>';
    }

    // colofão
    html +=   '<div class="colophon reveal" style="--d:'+nextDelay()+'ms"><dl>';
    html +=     row("Disciplina", esc(m.course||"—"));
    html +=     row("Trabalho", esc(m.tp||"—"));
    html +=     row("Grupo", renderField(m.group));
    html +=     row("Apresentação", renderField(m.presentationDate));
    html +=     row("Gerado em", fmtDateTime(m.generatedAt));
    html +=   '</dl></div>';

    // linha de veredito
    html +=   '<div class="verdict reveal" style="--d:'+nextDelay()+'ms">';
    html +=     vitem("Cobertura", vCov);
    html +=     vitem("Unidade", vUnit);
    html +=     vitem("E2E", vE2E);
    html +=     vitem("IA", vAI);
    html +=   '</div>';
    html += '</header>';

    /* ---------- 01 COBERTURA ---------- */
    var covVal = (cov.lines != null) ? cov.lines : (cov.statements != null ? cov.statements : null);
    var over = covVal != null && covVal >= threshold;
    html += '<section class="section" aria-labelledby="sec-cov">';
    html +=   '<div class="idx reveal">01</div>';
    html +=   '<div class="body">';
    html +=     '<span class="label sec-label">01 — Cobertura do backend</span>';
    html +=     '<h2 id="sec-cov" class="reveal">Cobertura medida</h2>';
    if (covVal == null){
      html += '<p class="tbd">cobertura não disponível</p>';
    } else {
      html += '<div class="cov-hero">';
      // numeral colossal — aria-label com o VALOR REAL desde o início (o .big anima e é decorativo)
      html +=   '<div class="cov-numeral '+(over?"over":"under")+'" data-count="'+covVal+'" data-thresh="'+threshold+'"'+
                ' role="img" aria-label="Cobertura de linhas: '+fmtPct(covVal).replace(".",",")+' por cento, meta '+threshold+' por cento ('+(over?"meta atingida":"abaixo da meta")+')">';
      html +=     '<span class="big" data-target="'+covVal+'" aria-hidden="true">0,0</span><span class="pct" aria-hidden="true">%</span>';
      html +=   '</div>';
      html +=   '<div class="cov-caption label '+(over?"over":"under")+'">Linhas cobertas · meta ≥ '+threshold+'% · <span class="cov-state">'+(over?"meta atingida":"abaixo da meta")+'</span></div>';
      // gauge linear
      html +=   '<div class="gauge" role="img" aria-label="Régua de cobertura: '+fmtPct(covVal)+' por cento, meta '+threshold+' por cento">';
      html +=     '<div class="track"></div>';
      html +=     '<div class="fill" style="--v:'+(covVal/100)+'; width:100%"></div>';

  /* ---- helpers de markup ---- */
  function row(k,v){ return '<dt>'+k+'</dt><dd>'+v+'</dd>'; }
  function vitem(label, ok){
    // glifo do sistema (─ ok / ● falha) + palavra, coerente com as linhas de teste; nunca só cor.
    return '<span class="vitem"><span class="vk">'+label+'</span>'+
      (ok
        ? '<span class="vmark ok"><span class="vg" aria-hidden="true">─</span> OK</span>'
        : '<span class="vmark bad"><span class="vg" aria-hidden="true">●</span> FALHA</span>')+
      '</span>';
  }
  function sublevel(name, val, threshold){
    var below = (val != null) && (val < threshold);
    var w = (val != null) ? Math.max(0, Math.min(100, val)) : 0;
    return '<div class="sublevel '+(below?"below":"")+'">'+
      '<span class="sl-name">'+name+'</span>'+
      '<span class="sl-val tnum">'+(val!=null?fmtPct(val)+"%":"—")+'</span>'+
      '<div class="sl-bar"><div class="b" style="--sv:'+(w/100)+'; transform:scaleX('+(prefersReduced?(w/100):0)+'); width:100%"></div><div class="t80"></div></div>'+
      '</div>';
  }

  /* ---- tabela de cobertura por arquivo ---- */
  var COV_KEYS = ["file","statements","branches","functions","lines"];
  var COV_LABELS = { file:"Arquivo", statements:"Cmd %", branches:"Ramo %", functions:"Func %", lines:"Linha %" };
  function renderCovTable(rows, threshold){
    if (!rows.length) return '<p class="tbd" style="margin-top:24px">cobertura por arquivo não disponível</p>';
    var h = '<div class="cov-table-wrap reveal"><table class="cov-table" id="covTable"><caption class="label" style="text-align:left;margin-bottom:8px">Cobertura por arquivo · destaque para &lt; '+threshold+'% · ordenável</caption><thead><tr>';
    COV_KEYS.forEach(function(k,i){
      h += '<th data-key="'+k+'" aria-sort="none"><button type="button">'+COV_LABELS[k]+'</button></th>';
    });
    h += '</tr></thead><tbody>';
    h += covTableBody(rows, threshold);
    h += '</tbody></table></div>';
    return h;
  }
  function covTableBody(rows, threshold){
    var b = "";
    rows.forEach(function(r){
      b += '<tr>';
      var below = anyBelow(r,threshold);
      b += '<td class="file">'+(below
              ? '<span class="flag" role="img" aria-label="abaixo da meta" title="abaixo da meta de '+threshold+'%">▸</span>'
              : '<span class="flag" style="visibility:hidden" aria-hidden="true">▸</span>')+esc(r.file)+'</td>';
      ["statements","branches","functions","lines"].forEach(function(k){
        var v = r[k];
        var lo = (v != null) && (v < threshold);
        var w = (v != null) ? Math.max(0,Math.min(100,v)) : 0;
        b += '<td class="'+(lo?"lo":"")+'"'+(lo?' title="abaixo da meta de '+threshold+'%"':"")+'>'+(v!=null?fmtPct(v):"—")+
             (lo?'<span class="sr"> (abaixo da meta)</span>':"")+
             '<span class="cell-bar"><span class="b" style="width:'+w+'%"></span></span></td>';
      });
      b += '</tr>';
    });
    return b;
  }
  function anyBelow(r, t){
    return ["statements","branches","functions","lines"].some(function(k){ return r[k]!=null && r[k]<t; });
  }
  var covState = { rows:null, threshold:80, key:null, dir:1 };
  function wireCovTableSort(){
    var table = document.getElementById("covTable");
    if (!table) return;
    var ths = table.querySelectorAll("thead th");
    ths.forEach(function(th){
      var btn = th.querySelector("button");
      btn.addEventListener("click", function(){ sortCov(th.getAttribute("data-key"), th); });
    });
  }
  function sortCov(key, th){
    // pega dados do DOM atual (mais simples e robusto p/ um único arquivo)
    var table = document.getElementById("covTable");
    var tbody = table.querySelector("tbody");
    var rows = Array.prototype.slice.call(tbody.querySelectorAll("tr"));
    var dir = (covState.key === key) ? -covState.dir : 1;
    covState.key = key; covState.dir = dir;
    var colIndex = COV_KEYS.indexOf(key);
    rows.sort(function(a,b){
      var av = a.children[colIndex].textContent.replace(/[▸\s]/g,"");
      var bv = b.children[colIndex].textContent.replace(/[▸\s]/g,"");
      if (key === "file") return dir * av.localeCompare(bv);
      var na = parseFloat(av.replace(",",".")) || -1;
      var nb = parseFloat(bv.replace(",",".")) || -1;
      return dir * (na - nb);
    });
    rows.forEach(function(r){ tbody.appendChild(r); });
    table.querySelectorAll("thead th").forEach(function(t){ t.setAttribute("aria-sort","none"); });
    th.setAttribute("aria-sort", dir === 1 ? "ascending" : "descending");
  }

  function ownerBadge(file){

    if (!o) return "";
    return '<span class="owner-badge own-'+o.k+'" title="Apresenta: '+esc(o.who)+
           ' — camada '+esc(o.camada)+'">'+esc(o.camada)+' · '+esc(o.who)+'</span>';

  function renderSuites(suites){
    if (!suites.length) return '<p class="tbd">nenhuma suíte disponível</p>';
    var h = "";
    suites.forEach(function(su){
      h += '<div class="suite">';
      h +=   '<div class="suite-head"><span class="sname">'+esc(su.name)+'</span>'+ownerBadge(su.file)+'<span class="sfile">'+esc(su.file||"")+'</span></div>';
      var tests = su.tests || [];
      if (!tests.length){
        h += '<p class="tbd" style="padding:10px 0">sem testes nesta suíte</p>';
      } else {
        // ordena: falhas ao topo
        var ordered = tests.slice().sort(function(a,b){
          var fa = a.status==="failed"?0:1, fb = b.status==="failed"?0:1;
          return fa - fb;
        });
        ordered.forEach(function(t){ h += renderTestRow(t); });
      }
      h += '</div>';
    });
    return h;
  }
  function renderTestRow(t){
    var st = t.status || "passed";
    var pinned = t.pinned === true;
    var g = STATUS_GLYPH[st] || "─";
    var word = STATUS_WORD[st] || st;
    var open = pinned ? " open" : "";
    var durTxt = (st==="skipped") ? "—" : fmtDur(t.durationMs);
    // aria-label completo: AT lê nome + status + duração de uma vez (glifo é decorativo)
    var aria = esc(t.name)+" — "+word+(st==="skipped"?"":(", "+durTxt));
    var h = '<div class="test-row '+(pinned?"pinned":"")+'">';
    h +=   '<details'+open+'>';
    h +=     '<summary class="st-'+st+'" aria-label="'+aria+'">';
    h +=       '<span class="g" aria-hidden="true">'+g+'</span>';
    h +=       '<span class="tname">'+esc(t.name)+(pinned?'<span class="pill">apresentar</span>':'')+'</span>';
    h +=       '<span class="st-word" aria-hidden="true">'+word+'</span>';
    h +=       '<span class="tdur tnum" aria-hidden="true">'+durTxt+'</span>';
    h +=     '</summary>';
    h +=     '<div class="test-detail">';
    // Apresentação: "O que testa" + "Resultado esperado" em destaque, ANTES do código.
    if (t.whatItTests || t.expectedResult){
      h +=     '<dl class="test-claims">';
      if (t.whatItTests){
        h +=     '<div class="claim"><dt class="claim-label">O que testa</dt><dd class="claim-text">'+esc(t.whatItTests)+'</dd></div>';
      }
      if (t.expectedResult){
        h +=     '<div class="claim"><dt class="claim-label">Resultado esperado</dt><dd class="claim-text">'+esc(t.expectedResult)+'</dd></div>';
      }
      h +=     '</dl>';
    }
    // Nota de revisor (legado) só aparece se houver e não duplicar o "O que testa".
    if (t.explanation && !t.whatItTests){
      h +=     '<div class="revisor-note"><span class="rn-label">Nota de revisor — o que este teste verifica</span>'+esc(t.explanation)+'</div>';
    }
    if (t.code){
      h +=     renderCode(t.code);
    }
    h +=     '</div>';
    h +=   '</details>';
    h += '</div>';
    return h;
  }
  function renderCode(code){
    var lines = String(code).split("\n");
    var h = '<div class="codeblock" role="group" aria-label="Código do teste">';
    lines.forEach(function(ln){
      h += '<div class="cl"><code>'+(esc(ln) || "&nbsp;")+'</code></div>';
    });
    h += '</div>';
    return h;
  }

  /* ---- E2E ---- */
  // Conta os casos it(...) dentro do código do spec (cada it = 1 teste E2E real).
  function countItCases(code){
    if (!code) return 0;
    var m = String(code).match(/\bit\s*\(/g);
    return m ? m.length : 0;
  }
  function renderE2E(items){
    if (!items.length) return '<p class="tbd">nenhum teste E2E disponível</p>';
    var h = '<div class="e2e-grid">';
    items.forEach(function(e, i){
      var st = e.status || "passed";
      var g = STATUS_GLYPH[st] || "─";
      var no = "E2E-" + String(i+1).padStart(2,"0");
      var nCases = countItCases(e.code);
      h += '<article class="e2e-card st-'+st+' reveal">';
      h +=   '<span class="e2e-no">'+no+'</span>';
      h +=   '<h3><span class="g" aria-hidden="true">'+g+'</span><span>'+esc(e.name)+'</span></h3>';
      // quem apresenta este E2E: Front (ótica da tela) + dono do ambiente/banco
      h +=   '<div class="owner-line">'+
             '<span class="owner-badge own-banco" title="Dono do E2E: sobe backend + banco fake e roda o Cypress, + camada de banco">E2E + Banco · '+esc(OWNER_E2E.infra)+'</span>'+
             '</div>';
      // selo de status (verde quando passou) + N/N de casos do spec + duração
      h +=   '<div class="e2e-meta">';
      h +=     '<span class="e2e-seal seal-'+st+'"><span class="g" aria-hidden="true">'+g+'</span>'+STATUS_WORD[st]+
               (nCases>0 ? ' · '+(st==="passed"?nCases:0)+'/'+nCases : '')+'</span>';
      h +=     '<span class="dur">'+fmtDur(e.durationMs)+'</span>';
      h +=   '</div>';
      // vídeo embutido (preload metadata): a captura do fluxo é a prova
      if (e.video){
        h += '<figure class="figframe e2e-video">';
        h +=   '<video controls preload="metadata" playsinline src="'+esc(e.video)+'" '+
               'style="width:100%;display:block;border-radius:2px;background:#000" '+
               'aria-label="Vídeo do teste E2E '+esc(e.name)+'"></video>';
        h +=   '<figcaption>fig. captura de vídeo · '+esc(e.video.split("/").pop())+'</figcaption>';
        h += '</figure>';
      } else if (e.screenshot){
        h += '<figure class="figframe"><img loading="lazy" src="'+esc(e.screenshot)+'" alt="Captura de tela do teste '+esc(e.name)+'"><figcaption>fig. captura</figcaption></figure>';
      } else {
        h += '<div class="fig-missing" role="img" aria-label="Vídeo não disponível">vídeo não disponível para este fluxo</div>';
      }
      // "O que testa" + "Resultado esperado" — apresentação, em destaque
      if (e.whatItTests || e.expectedResult){
        h += '<dl class="test-claims">';
        if (e.whatItTests){
          h += '<div class="claim"><dt class="claim-label">O que testa</dt><dd class="claim-text">'+esc(e.whatItTests)+'</dd></div>';
        }
        if (e.expectedResult){
          h += '<div class="claim"><dt class="claim-label">Resultado esperado</dt><dd class="claim-text">'+esc(e.expectedResult)+'</dd></div>';
        }
        h += '</dl>';
      }
      // passos do fluxo
      if (e.steps && e.steps.length){
        h += '<ol class="e2e-steps">';
        e.steps.forEach(function(s){ h += '<li>'+esc(s)+'</li>'; });
        h += '</ol>';
      }
      // código do spec (recolhível)
      if (e.explanation || e.code){
        h += '<details style="margin-top:6px">';
        h +=   '<summary class="label" style="cursor:pointer;padding:6px 0">ver código do spec</summary>';
        if (e.explanation && !e.whatItTests){ h += '<div class="revisor-note"><span class="rn-label">O que este fluxo valida</span>'+esc(e.explanation)+'</div>'; }
        if (e.code){ h += renderCode(e.code); }
        h += '</details>';
      }
      h += '</article>';
    });
    h += '</div>';
    return h;
  }
  function wireE2EButtons(){
    var dlg = document.getElementById("videoDialog");

    document.querySelectorAll(".vid-btn").forEach(function(btn){
      btn.addEventListener("click", function(){

        player.src = src;
        title.textContent = btn.getAttribute("data-title") || "Vídeo";
        if (typeof dlg.showModal === "function"){ dlg.showModal(); }
        else { window.open(src, "_blank"); }
      });
    });
    document.getElementById("videoDlgClose").addEventListener("click", function(){ closeDlg(); });
    dlg.addEventListener("cancel", function(){ closeDlg(); });
    dlg.addEventListener("close", function(){ player.pause(); player.removeAttribute("src"); player.load(); });
    function closeDlg(){ if (dlg.open) dlg.close(); }
  }

  /* ---- pirâmide ---- */
  function renderPyramid(p){
    // integration === null/TBD => "a definir" (NÃO cai para 0 silenciosamente).
    var unitTBD = isTBD(p.unit);
    var integTBD = isTBD(p.integration);
    var unit = unitTBD ? 0 : (p.unit || 0);
    var integ = integTBD ? 0 : (p.integration || 0);
    var e2e = (p.e2e != null ? p.e2e : 4);
    var max = Math.max(unit, integ, e2e, 1);
    var rows = [
      { label:"E2E", count:e2e, tbd:false, pd:0 },
      { label:"Integração", count:integ, tbd:integTBD, pd:120 },
      { label:"Unidade", count:unit, tbd:unitTBD, pd:240 }
    ];
    // pirâmide acessível: lista de linhas com valores reais (AT lê os números),
    // as barras são puramente visuais (aria-hidden). integration==null => "a definir".
    var h = '<ul class="pyramid bars-trigger" aria-label="Pirâmide de testes (distribuição da suíte)">';
    rows.forEach(function(r){
      // barra zerada quando o valor é "a definir" (não inventa largura)
      var w = r.tbd ? 0 : Math.max(0.08, r.count/max);
      h += '<li class="pyr-row">';
      h +=   '<span class="pr-label">'+r.label+'</span>';
      h +=   '<div class="pr-bar" aria-hidden="true" style="--pv:'+w+'; --pd:'+r.pd+'ms; transform:scaleX('+(prefersReduced?w:0)+'); width:100%"></div>';
      h +=   '<span class="pr-count tnum">'+(r.tbd?'<span class="tbd">a definir</span>':r.count)+'</span>';
      h += '</li>';
    });
    h += '</ul>';
    h += '<p class="pyr-caption">fig. A base larga de testes de unidade/integração sustenta poucos testes E2E ('+e2e+'), seguindo a pirâmide de testes recomendada — barato e rápido embaixo, caro e lento no topo.</p>';
    return h;
  }

  /* ---- equipe ---- */
  function memberIsPending(mem){
    var contribs = mem.contributions || [];
    var contribTBD = !contribs.length || contribs.every(isTBD);
    return isTBD(mem.role) && contribTBD && mem.commits == null;
  }
  function renderTeam(team){
    if (!team.length) return '<p class="tbd">equipe não disponível</p>';
    var allPending = team.every(memberIsPending);
    var h = '<div class="team">';
    // faixa explicativa honesta no topo quando tudo ainda é TBD (em vez de 4 "a definir" soltos)
    if (allPending){
      h += '<p class="team-pending"><span class="tp-label">Divisão de trabalho — pendente</span>'+
           'Papéis e contribuições de cada membro serão preenchidos pela organização do grupo antes da apresentação. Os nomes abaixo são definitivos; o detalhamento por pessoa segue a definir.</p>';
    }
    team.forEach(function(mem){
      var pending = memberIsPending(mem);
      var contribs = mem.contributions || [];
      var contribHtml;
      if (!contribs.length || contribs.every(isTBD)){
        // placeholder com aparência de campo-a-preencher (não "falha")
        contribHtml = '<p class="m-contrib"><span class="field-pending">contribuição a preencher</span></p>';
      } else {
        contribHtml = '<p class="m-contrib">'+contribs.map(function(c){ return isTBD(c)?'<span class="tbd">a definir</span>':esc(c); }).join(" · ")+'</p>';
      }
      h += '<div class="member'+(pending?" is-pending":"")+'">';
      h +=   '<div class="inits" aria-hidden="true">'+esc(initials(mem.name))+'</div>';
      h +=   '<div>';
      h +=     '<p class="m-name">'+esc(mem.name)+'</p>';
      h +=     '<p class="m-role">'+(isTBD(mem.role)?'<span class="field-pending">papel a definir</span>':esc(mem.role))+'</p>';
      h +=     contribHtml;
      h +=     '<p class="m-commits">commits: '+(mem.commits==null?"—":esc(mem.commits))+'</p>';
      h +=   '</div>';
      h += '</div>';
    });
    h += '</div>';
    return h;
  }

  /* ============================================================
     MOVIMENTO
     ============================================================ */
  function setFinal(el, target, isInt){
    el.textContent = isInt ? String(Math.round(target)) : fmtPct(target).replace(".",",");
  }
  function animateCountUp(data){
    if (reducedNow()){
      // estado final imediato: mostra valores reais direto
      document.querySelectorAll("[data-target]").forEach(function(el){
        setFinal(el, parseFloat(el.getAttribute("data-target")), el.classList.contains("up-int"));
      });
      return;
    }
    var els = document.querySelectorAll("[data-target]");
    els.forEach(function(el){
      var target = parseFloat(el.getAttribute("data-target"));
      var isInt = el.classList.contains("up-int");
      var dur = 900;
      var start = null;
      var covWrap = el.closest(".cov-numeral");
      var threshold = covWrap ? parseFloat(covWrap.getAttribute("data-thresh")) : null;
      var crossed = false;
      function step(ts){
        // se o usuário ativar reduzir-movimento DURANTE a animação, salta ao valor final
        if (reducedNow()){ setFinal(el, target, isInt); return; }
        if (start === null) start = ts;
        var p = Math.min(1, (ts - start)/dur);
        var eased = 1 - Math.pow(1-p, 3); // ~cubic-bezier(.2,.8,.2,1)
        var cur = target * eased;
        el.textContent = isInt ? String(Math.round(cur)) : fmtPct(cur).replace(".",",");
        if (threshold != null && !crossed && cur >= threshold){
          crossed = true;
          var tick = document.querySelector(".gauge .threshtick");
          if (tick) tick.classList.add("pulse");
        }
        if (p < 1){ requestAnimationFrame(step); }
        else { setFinal(el, target, isInt); }
      }
      requestAnimationFrame(step);
    });
  }

  function revealOnScroll(){
    var nodes = document.querySelectorAll(".reveal, .bars-trigger");
    // fallback: sem IO ou reduzir-movimento => estado final imediato, conteúdo completo
    if (reducedNow() || !("IntersectionObserver" in window)){
      nodes.forEach(function(el){
        el.style.opacity = 1;
        el.classList.add(el.classList.contains("bars-trigger") ? "bars-in" : "in");
      });
      return;
    }
    // dispara revealUp quando o elemento entra na viewport; o stagger é relativo
    // aos irmãos que entram na MESMA leva (não fixado no markup nem tocado fora da tela).
    var BASE = 90; // ms entre irmãos
    var io = new IntersectionObserver(function(entries){
      // ordena os que entraram agora pela posição no documento p/ um stagger coerente
      var nowIn = entries.filter(function(en){ return en.isIntersecting; })
        .sort(function(a,b){
          return a.target.compareDocumentPosition(b.target) & Node.DOCUMENT_POSITION_FOLLOWING ? -1 : 1;
        });
      nowIn.forEach(function(en, i){
        var el = en.target;
        if (el.classList.contains("bars-trigger")){
          el.classList.add("bars-in"); // barras (gauge/pirâmide) crescem ao entrar
        } else {
          // respeita um --d já definido no markup; senão escalona pela ordem de entrada
          if (!el.style.getPropertyValue("--d")) el.style.setProperty("--d", (i*BASE)+"ms");
          el.classList.add("in");
        }
        el.style.willChange = "auto";
        io.unobserve(el);
      });
    }, { rootMargin:"0px 0px -8% 0px", threshold:0.05 });
    nodes.forEach(function(el){ io.observe(el); });
  }

  /* go */
  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", load);
  } else { load(); }
})();
</script>
